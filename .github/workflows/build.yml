
name: Build LiquidGlass v1.8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          ZIP_FILE="LiquidGlass-ControlCenter-v1_8-connectivity-controls.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/gradlew" ]; then
            echo "ERROR: Android project structure not found!"
            exit 1
          fi

          rsync -a --exclude='.github/' extracted/ ./

          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/LiquidGlass-v1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-v1.8-APK
          path: dist/LiquidGlass-v1.8.apk
