
name: Build LiquidGlass v1.8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP_FILE="LiquidGlass-ControlCenter-v1_8-connectivity-controls.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP file not found"
            exit 1
          }

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/gradlew" ]; then
            echo "ERROR: gradlew not found in extracted project"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          rsync -a extracted/ ./
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist

          find app/build/outputs/apk/release \
            -name "*.apk" -type f -exec cp {} dist/LiquidGlass-v1.8.apk \;

          test -f dist/LiquidGlass-v1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-v1.8-APK
          path: dist/LiquidGlass-v1.8.apk
