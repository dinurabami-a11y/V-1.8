
name: Build LiquidGlass v1.8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          ZIP_FILE="LiquidGlass-ControlCenter-v1_8-connectivity-controls.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          if [ ! -f android-project/gradlew ]; then
            echo "ERROR: Gradle wrapper not found!"
            find android-project -maxdepth 3 -type f
            exit 1
          fi

          chmod +x android-project/gradlew

      - name: Build Release APK
        working-directory: android-project
        run: |
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Collect APK
        working-directory: android-project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/dist/LiquidGlass-v1.8.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-v1.8-APK
          path: dist/LiquidGlass-v1.8.apk
          if-no-files-found: error
